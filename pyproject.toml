[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datake"
version = "0.1.0"
description = "Automated data processing tool for CSV and Excel files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
datake = "datake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
